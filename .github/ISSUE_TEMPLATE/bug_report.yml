name: XperSlot issue report
description: Report a reproducible problem with an XperSlot app or published release.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Check the release status first. Do not include passwords, one-time codes, tokens, personal data, payment details, or private business/customer records.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - XperSlot Customer
        - XperSlot Business
        - Both apps
        - Release / download
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Use the version shown in the app, if installed.
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Xiaomi device, Android 14
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
